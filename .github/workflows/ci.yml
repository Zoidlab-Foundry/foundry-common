name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Package (build + import)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Compile check
        run: python -m compileall -q src
      - name: Import check
        run: |
          python -c "import foundry_common, foundry_common.auth, foundry_common.entitlements, foundry_common.db, foundry_common.llm; print('foundry-common OK')"
