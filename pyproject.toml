[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-common"
version = "0.2.4"
description = "Shared platform modules for ZoidLab Foundry apps: auth/session, Nyquest Pro entitlements, export envelope, relay client, pricing, and the Postgres+RLS core."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.8",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # auth.py and assistant.py import fastapi, assistant.py imports pydantic. These were
    # undeclared, so `pip install foundry-common` into a clean environment produced a package
    # that raised ModuleNotFoundError on import. It only ever worked because every consuming
    # app installs fastapi itself; CI on a bare runner is what surfaced it.
    "fastapi>=0.110",
    "pydantic>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
